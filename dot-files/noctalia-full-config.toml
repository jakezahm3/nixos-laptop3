command_line = """magick -font 'Seven-Segment' -size 270x100 canvas:black -transparent black -pointsize 128 -fill '#FF2400' -draw 'text 0,100 \\\"%H\\\"' -fill white -pointsize 84 -draw 'text 120,100 \\\":%M\\\"' -fill '#FF2400' -stroke '#FF2400' -strokewidth 5 -draw 'line 225,0 225,100' -strokewidth 0 -stroke white -fill white -pointsize 32 -draw 'text 235, 25 \\\"%m\\\"' -draw 'text 235, 60 \\\"%d\\\"' -draw 'text 235, 95 \\\"%a\\\"' '%output_file'
"""
type = "jinliu/imagemagick-clock:clock"

[widget.active_window]
icon_size = 14.0
max_length = 260.0
min_length = 80.0
title_scroll = "none"
type = "active_window"

[widget.bar]
type = "rylos/tailnet:bar"

[widget.bar_2]
type = "noctalia/umbriel-companion:bar"

[widget.bar_3]
capsule = true
capsule_border_width = 1.5
font_scale = 1.25
scale = 1.3
type = "noctalia/umbriel-companion:bar"

[widget.bar_4]
capsule = true
capsule_fill = "on_primary"
scale = 1.6500000000000001
type = "prponkshe/umbriel-displays:bar"

[widget.bar_5]
type = "jakezahm3/wallpaper_depth_nix:bar"

[widget.bluetooth]
scale = 1.5
type = "bluetooth"

[widget.btn]
type = "ezequiel/mango_layouts:btn"

[widget.clock]
anchor = true
capsule = true
capsule_border_width = 0.0
capsule_opacity = 0.0
capsule_padding = 0
capsule_radius = 1
color = "primary"
font_family = "TeX Gyre Heros"
font_scale = 1.1699999999999999
font_weight = 700
format = "{:%I:%M %p}"
scale = 1.6500000000000001
show_tooltip = true
timezone = "US/Eastern"
type = "clock"

[widget.clock_3]
command_line = """magick -font 'Seven-Segment' -size 270x100 canvas:black -transparent black -pointsize 128 -fill '#FF2400' -draw 'text 0,100 \\\"%H\\\"' -fill white -pointsize 84 -draw 'text 120,100 \\\":%M\\\"' -fill '#FF2400' -stroke '#FF2400' -strokewidth 5 -draw 'line 225,0 225,100' -strokewidth 0 -stroke white -fill white -pointsize 32 -draw 'text 235, 25 \\\"%m\\\"' -draw 'text 235, 60 \\\"%d\\\"' -draw 'text 235, 95 \\\"%a\\\"' '%output_file'
"""
enabled = false
image_height = 102
image_width = 125
type = "jinliu/imagemagick-clock:clock"

[widget.clock_4]
command_line = """magick -font 'Seven-Segment' -size 270x100 canvas:black -transparent black -pointsize 50 -fill '#FF2400' -draw 'text 0,100 \\\"i:%I:%M %p\\\"' '%output_file'
"""
type = "jinliu/imagemagick-clock:clock"

[widget.clock_5]
capsule = true
capsule_border = "primary"
capsule_border_width = 0.5
capsule_opacity = 0.14999999999999999
capsule_padding = 24
capsule_radius = 8
command_line = ""
image_height = 387
type = "jinliu/imagemagick-clock:clock"

[widget.control-center]
capsule = true
capsule_fill = "on_primary"
scale = 1.6500000000000001
type = "control-center"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.icon]
type = "egno/vial_keymap:icon"

[widget.input_volume]
device = "input"
type = "volume"

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.keyboard_layout]
hide_when_single_layout = false
type = "keyboard_layout"

[widget.launcher]
anchor = true
capsule = true
capsule_border_width = 1.5
capsule_fill = "on_primary"
glyph = "server-2"
scale = 1.6500000000000001
type = "launcher"

[widget.lock_keys]
display = "short"
hide_when_off = false
show_caps_lock = true
show_num_lock = true
show_scroll_lock = false
type = "lock_keys"

[widget.media]
art_size = 16.0
hide_when_idle = true
hide_when_no_media = true
max_length = 220.0
min_length = 80.0
title_scroll = "none"
type = "media"

[widget.network]
show_label = false
type = "network"

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.output_volume]
device = "output"
type = "volume"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.screenshot-reg]
capsule = true
capsule_fill = "on_primary"
glyph = "camera-rotate"
scale = 1.6500000000000001
type = "custom_button"

    [widget.screenshot-reg.actions]
    left = "exec noctalia msg screenshot-region"

[widget.session]
capsule_border_width = 1.5
font_weight = 700
type = "session"

[widget.spacer]
interactive = true
type = "spacer"

[widget.spacer_4]
length = 204
type = "spacer"

[widget.spacer_5]
type = "spacer"

[widget.status]
capsule = true
capsule_border = "primary"
capsule_border_width = 0.5
capsule_fill = "on_primary"
capsule_opacity = 0.91000000000000003
capsule_padding = 11
font_weight = 200
scale = 0.65000000000000002
type = "davemhammer/tailscale:status"

[widget.sway-mode]
type = "ismay/sway-mode:sway-mode"

[widget.taildrop]
glyph = "arrow-up"
type = "custom_button"

    [widget.taildrop.actions]
    left = "exec noctalia msg panel-toggle carlocamacho/taildrop:send"
    middle = "settings-open-widget [default][taildrop]"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"

[widget.volume]
show_label = false
type = "volume"

[widget.wallhaven]
font_scale = 1.1899999999999999
scale = 1.45
type = "noctalia/wallhaven:wallhaven"

[widget.wallhaven_2]
anchor = true
scale = 1.1000000000000001
type = "noctalia/wallhaven:wallhaven"

    [widget.wallhaven_2.actions]
    middle = "settings-open-widget [plugins][wallhaven]"

[widget.wallhaven_3]
capsule = true
capsule_fill = "on_primary"
scale = 1.5
type = "noctalia/wallhaven:wallhaven"

[widget.wallpaper]
capsule = true
capsule_border = "primary"
capsule_border_width = 0.5
capsule_fill = "on_primary"
glyph = "assembly"
scale = 1.6500000000000001
type = "wallpaper"

[widget.widget]
type = "tphilippot/git_companion:widget"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_border = "primary"
capsule_border_width = 0.5
capsule_opacity = 0.75
capsule_padding = 16
capsule_radius = "auto"
empty_color = "tertiary"
focused_output_only = true
font_scale = 1.0600000000000001
inactive_pill_size = 1.2000000000000002
label_source = "name"
max_label_chars = 2
scale = 1.05
show_all_outputs = true
type = "workspaces"

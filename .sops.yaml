# Recipients that can decrypt files sops creates under secrets/.
# After changing this list, run `sops updatekeys secrets/secrets.yaml`.
keys:
  # Personal key (~/.config/sops/age/keys.txt): lets you edit secrets with `sops`.
  - &admin_jzahm age1etldc337fek347y6lhtc96gmsfmrdr053fkfe7j7p3e4j7v4dqws0f2jfu
  # This machine's SSH host key, converted with ssh-to-age: sops-nix decrypts with it at boot.
  - &host_nixos age19x92wxkrkk9z3wmpk9rk8zam6tauhgzw2jfk9fmh9zz0vnyn5ajq5ucg06
creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *admin_jzahm
          - *host_nixos
